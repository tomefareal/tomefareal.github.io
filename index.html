
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oxveah</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1a1a2e, #16213e);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .box {
    padding: 40px;
    background: rgba(255,255,255,0.05);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  h1 {
    font-size: 42px;
    background: linear-gradient(90deg, #00d4ff, #7b61ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p { font-size: 18px; color: #cbd5e1; }
</style>
</head>
<body>
  <div class="box">
    <h1>Bienvenue sur Oxveah</h1>
    <p>Oxveah est une entreprise de création d'applications par la force et la loyauté.</p>
  </div>
</body>
</html>
